# Dùng cho ứng dụng/service chạy nền — xác thực bằng keytab, không cần kinit.
# Copy keytab từ server:  docker cp krb5-kdc:/krb/kafkaclient.keytab ./kafkaclient.keytab
security.protocol=SASL_PLAINTEXT
sasl.mechanism=GSSAPI
sasl.kerberos.service.name=kafka
sasl.jaas.config=com.sun.security.auth.module.Krb5LoginModule required \
    useKeyTab=true \
    storeKey=true \
    keyTab="/etc/kafka/kafkaclient.keytab" \
    principal="kafkaclient@KAFKA.LOCAL";
