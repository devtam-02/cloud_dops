# ============================================================================
#  promotion-ingestion — cấu hình chạy LOCAL bằng Docker
#
#  Nguồn gốc: config staging của chính service này trong repo cấu hình
#  (promotion-ingestion/staging/application.properties, commit 2d1d3c7).
#  CHỈ các trường KẾT NỐI DỊCH VỤ được đổi để trỏ về docker local; toàn bộ
#  tham số nghiệp vụ, producer/consumer, retry, DLQ, batch... giữ nguyên.
#
#  Nạp qua SPRING_CONFIG_ADDITIONAL_LOCATION (xem docker-compose.yml).
#  Hostname khớp tên service của ../../infrastructure: mariadb, redis, kafka.
#  Cụm Kerberos: kafka.kafka.local (alias của ../../krb-experiment).
# ============================================================================

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
spring.application.name=ingestion
spring.application.context-path=/promotion/promotion-ingestion

# --- ĐÃ ĐỔI: MariaDB staging 10.254.181.137:4006 -> container mariadb -------
spring.datasource.url=jdbc:mariadb://mariadb:3306/promotion_ingestion?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# Giá trị thật nằm ở .env, truyền vào container qua biến môi trường
spring.datasource.password=${MARIADB_ROOT_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

server.port=8080
springdoc.api-docs.path=${spring.application.context-path}/v3/api-docs
springdoc.swagger-ui.path=${spring.application.context-path}/swagger-ui.html

# --- ĐÃ ĐỔI: local không có Eureka -> tắt đăng ký service registry ----------
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.tracing.brave.enabled=true
management.tracing.propagation.type=b3
management.zipkin.tracing.enabled=false
management.zipkin.tracing.endpoint=

promix.mongo.enabled=false

# ============================================================================
#  Cụm Kafka NỘI BỘ (promix-messaging starter) — PLAINTEXT, KHÔNG Kerberos.
#  Đây là nơi service ghi output và DLQ. Khác hoàn toàn cụm BI/Data bên dưới.
#  ĐÃ ĐỔI: 3 broker staging -> broker `kafka` của stack promotion-phase2-local
# ============================================================================
promix.messaging.enabled=true
promix.messaging.avro.enabled=false
promix.messaging.avro.producer.enabled=false
promix.messaging.avro.schema-registry.url=
promix.messaging.kafka.bootstrap-servers[0]=kafka:9092
promix.messaging.kafka.client-id=ingestion
promix.messaging.kafka.enable-avro=false
promix.messaging.kafka.security.protocol=PLAINTEXT
promix.messaging.kafka.sasl.enabled=false
promix.messaging.kafka.sasl.security-protocol=PLAINTEXT

promix.messaging.kafka.producer.acks=all
promix.messaging.kafka.producer.retries=5
promix.messaging.kafka.producer.batch-size=16384
promix.messaging.kafka.producer.linger=10
promix.messaging.kafka.producer.compression-type=lz4
promix.messaging.kafka.producer.buffer-memory=33554432
promix.messaging.kafka.producer.enable-idempotence=true
promix.messaging.kafka.producer.max-in-flight=5
promix.messaging.kafka.producer.request-timeout=30000
promix.messaging.kafka.producer.delivery-timeout=120000
promix.messaging.kafka.producer.retry-backoff=100
promix.messaging.kafka.producer.use-avro=false

promix.messaging.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
promix.messaging.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
promix.messaging.kafka.consumer.group-id=ingestion-group-local
promix.messaging.kafka.consumer.auto-offset-reset=earliest
promix.messaging.kafka.consumer.enable-auto-commit=false
promix.messaging.kafka.consumer.max-poll=500
promix.messaging.kafka.consumer.max-poll-interval=300000
promix.messaging.kafka.consumer.fetch-min-bytes=1
promix.messaging.kafka.consumer.fetch-max-bytes=52428800
promix.messaging.kafka.consumer.fetch-max-wait=500
promix.messaging.kafka.consumer.isolation-level=read_committed
promix.messaging.kafka.consumer.concurrency=3
promix.messaging.kafka.consumer.batch-listener=true
promix.messaging.kafka.consumer.ack-mode=MANUAL_IMMEDIATE
promix.messaging.kafka.consumer.session-timeout=30000
promix.messaging.kafka.consumer.heartbeat-interval=10000
promix.messaging.kafka.consumer.use-avro=false
promix.messaging.kafka.consumer.specific-avro-reader=false
promix.messaging.kafka.consumer.retry.enabled=true
promix.messaging.kafka.consumer.retry.initial-interval=1000
promix.messaging.kafka.consumer.retry.max-attempts=3
promix.messaging.kafka.consumer.retry.multiplier=1.5
promix.messaging.kafka.consumer.retry.max-interval=5000
promix.messaging.kafka.consumer.error-handling.enable-dlq=true
promix.messaging.kafka.consumer.error-handling.dlq-topic-suffix=_dlq
promix.messaging.kafka.consumer.error-handling.dlq-partitioning-enabled=false
promix.messaging.kafka.consumer.error-handling.max-failures=3
promix.messaging.kafka.consumer.error-handling.include-headers=true

# ============================================================================
#  Redis — ĐÃ ĐỔI: cluster 3 node staging -> redis đơn của stack promotion
# ============================================================================
promix.cache.enabled=true
promix.cache.caffeine.enabled=false
promix.cache.redis.enabled=false
promix.cache.redisson.enabled=true
promix.cache.redisson.mode=SINGLE
promix.cache.redisson.address=redis://redis:6379
promix.cache.redisson.password=${REDIS_PASSWORD}
promix.cache.redisson.database=0
promix.cache.redisson.connection-timeout=10000
promix.cache.redisson.timeout=10000
promix.cache.redisson.retry-attempts=3
promix.cache.redisson.retry-interval=1500
promix.cache.redisson.default-ttl=30m
promix.cache.redisson.max-idle-time=15m
promix.cache.redisson.default-max-size=1000
promix.cache.redisson.codec=org.redisson.codec.JsonJacksonCodec
promix.cache.redisson.pool.min-idle=5
promix.cache.redisson.pool.max-pool-size=50

promix.observer.tracing.enabled=true
promix.observer.tracing.sampling-rate=0.05
promix.observer.tracing.zipkin.enabled=false
promix.observer.tracing.baggage.enabled=true
promix.observer.tracing.baggage.correlation.enabled=true
promix.observer.tracing.baggage.correlation.fields[0]=correlationId
promix.observer.tracing.baggage.correlation.fields[1]=businessId
promix.observer.tracing.baggage.correlation.fields[2]=eventType

ingestion.kafka.producer.topic-prefix=promotion.internal.event.
ingestion.kafka.consumer.topic-pattern=^promotion_external_(?!.*dlq$).*$
ingestion.kafka.consumer.group-id=ingestion-group-local
ingestion.batch-processing.core-pool-size=${INGESTION_CORE_POOL_SIZE:4}
ingestion.batch-processing.max-pool-size=${INGESTION_MAX_POOL_SIZE:16}
ingestion.batch-processing.queue-capacity=1000
ingestion.batch-processing.keep-alive-seconds=60
ingestion.batch-processing.thread-name-prefix=event-processor-
ingestion.batch-processing.metrics-enabled=true

# ============================================================================
#  Cụm BI/Data — Kerberos (SASL/GSSAPI). Khối này KHÔNG có trong config
#  staging vì PR #7 chưa được triển khai; thêm mới để chạy với stack Kerberos.
#  keyTab và krb5.conf lấy từ volume dùng chung của stack KDC (mount ở /krb).
# ============================================================================
ingestion.kafka.bi-data.enabled=true
ingestion.kafka.bi-data.bootstrap-servers[0]=kafka.kafka.local:9094
ingestion.kafka.bi-data.topic=promotion_platform_bi_events
ingestion.kafka.bi-data.group-id=ingestion-bi-data-group
ingestion.kafka.bi-data.concurrency=3
ingestion.kafka.bi-data.max-poll-records=50
ingestion.kafka.bi-data.security.protocol=SASL_PLAINTEXT
ingestion.kafka.bi-data.security.mechanism=GSSAPI
ingestion.kafka.bi-data.security.service-name=kafka
ingestion.kafka.bi-data.security.principal=ingestion@KAFKA.LOCAL
ingestion.kafka.bi-data.security.key-tab=/krb/ingestion.keytab

logging.level.brave.Tracer=INFO
logging.level.brave=INFO
logging.level.zipkin2=INFO
logging.level.com.netflix.discovery=WARN
logging.level.com.netflix.eureka=WARN
logging.level.org.springframework.scheduling=WARN
logging.level.vn.viettel.vds.promotion.ingestion=DEBUG
