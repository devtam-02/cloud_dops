name: microservice-keycloak

services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: unless-stopped
    # `start` (không phải start-dev): bật persistence thật.
    # HTTPS do chính Keycloak phục vụ ở 8443 bằng cert trong ./certs;
    # HTTP 8180 vẫn bật cho truy cập nội bộ và healthcheck.
    command:
      - start
      - --http-enabled=true
      - --https-port=8443
      # hostname-strict=false: cho phép truy cập cả qua HTTP 8180 lẫn HTTPS
      # 8443 mà không bị Keycloak từ chối vì host không khớp KC_HOSTNAME.
      - --hostname-strict=false
      - --proxy-headers=xforwarded
    environment:
      # --- Database ---------------------------------------------------
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?thiếu trong .env}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?thiếu trong .env}

      # --- Tài khoản admin đầu tiên (chỉ dùng lần khởi tạo) -----------
      # Bản 26 dùng KC_BOOTSTRAP_ADMIN_*; KEYCLOAK_ADMIN/_PASSWORD là tên cũ
      # của bản <= 25, đặt thêm chỉ sinh cảnh báo deprecated nên đã bỏ.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?thiếu trong .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?thiếu trong .env}

      # --- Truy cập từ ngoài ------------------------------------------
      # KC_HOSTNAME là URL mà NGƯỜI DÙNG gõ, không phải địa chỉ container.
      # Keycloak nhúng giá trị này vào link trong admin console, vào
      # issuer của token và vào redirect OIDC. Để trống + hostname-strict
      # =false thì Keycloak suy ra từ header request — chạy được nhưng
      # token sẽ có issuer khác nhau tuỳ client gõ localhost hay IP, làm
      # hỏng việc xác thực token ở service khác. Đặt IP/tên miền thật.
      # Dùng HTTPS thì đặt KEYCLOAK_HOSTNAME_URL=https://<host>:8443 —
      # để http://...:8180 ở đây thì issuer và mọi link vẫn là HTTP dù 8443
      # đã mở, và client OIDC sẽ bị chuyển về HTTP.
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_URL:-}
      # Hai file này phải TỒN TẠI trong ./certs trước khi up, nếu không
      # Keycloak bỏ qua HTTPS và 8443 không có ai nghe. Sinh bằng:
      #     ./deploy-keycloak.sh
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/certs/cert.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/certs/key.pem

      KC_HTTP_ENABLED: "true"
      # KHÔNG dùng KC_PROXY: biến này bị bỏ từ bản 24 và xoá hẳn ở 26, lại
      # mang nghĩa "TLS kết thúc ở proxy" -> Keycloak chỉ phục vụ HTTP và
      # không bao giờ mở 8443. Thay bằng --proxy-headers ở phần command.
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: ${KEYCLOAK_LOG_LEVEL:-INFO}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      
    ports:
      - "${KEYCLOAK_BIND:-0.0.0.0}:${KEYCLOAK_PORT:-8180}:8080"
      - "${KEYCLOAK_BIND:-0.0.0.0}:${KEYCLOAK_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./certs:/opt/keycloak/conf/certs:ro

    networks:
      - microservice-local
    healthcheck:
      # KHÔNG dùng cổng quản trị 9000: khi HTTPS được bật, Keycloak chuyển
      # luôn interface đó sang HTTPS, mà image không có curl/wget/openssl —
      # chỉ có bash — nên không bắt tay TLS được. Hệ quả là healthcheck cũ
      # kẹt mãi ở "health: starting" dù Keycloak chạy hoàn toàn bình thường.
      #
      # Thay bằng một request HTTP thật tới listener 8080 hỏi OIDC discovery
      # của realm master: chỉ trả về issuer khi Keycloak đã nạp xong realm,
      # nên đây là tín hiệu sẵn sàng thực sự chứ không chỉ là "cổng đã mở".
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/master/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"issuer"' <&3
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

networks:
  microservice-local:
    external: true
    name: microservice-local