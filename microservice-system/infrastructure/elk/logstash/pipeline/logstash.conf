# ---------------------------------------------------------------------------
#  Pipeline mặc định: nhận log từ Beats và từ TCP, đẩy vào Elasticsearch.
#  Sửa file này rồi `docker compose restart logstash` là đủ.
# ---------------------------------------------------------------------------

input {
  # Filebeat / Elastic Agent
  beats {
    port => 5044
  }

  # TCP: mỗi dòng một JSON. Tiện cho app Spring Boot dùng logstash-logback-encoder.
  # Thử nhanh:  echo '{"message":"hello","level":"INFO"}' | nc <host> 5000
  tcp {
    port  => 5000
    codec => json_lines
  }
}

filter {
  # Nếu message là JSON lồng trong chuỗi thì bóc ra thành field thật.
  if [message] =~ /^\s*\{/ {
    json {
      source        => "message"
      skip_on_invalid_json => true
    }
  }

  # Chuẩn hoá tên service để dễ lọc trong Kibana
  if ![service] and [spring][application][name] {
    mutate { copy => { "[spring][application][name]" => "service" } }
  }
}

output {
  elasticsearch {
    hosts    => ["${ELASTIC_HOSTS}"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    # Một data stream theo ngày; đổi tên nếu muốn tách theo service.
    index    => "logs-%{+YYYY.MM.dd}"
  }

  # Bỏ comment khi cần soi trực tiếp trong log của container logstash
  # stdout { codec => rubydebug }
}
